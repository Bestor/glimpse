services:
  tooling:
    build: ./
    command: -c "import time; time.sleep(1000000000)"
    entrypoint: python
    env_file:
      - .env
    working_dir: /glimpse
    volumes:
      - ./:/glimpse


  api:
    build: ./glimpse-api
    command: run main.go
    entrypoint: go
    env_file:
      - .env
    working_dir: /glimpse
    volumes:
      - ./glimpse-api:/glimpse
    ports:
      - "8080:8080"

    healthcheck:
      test: "curl --fail http://api:8080/events"
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 40s

  ui:
    build: ./glimpse-ui
    command: http-server
    #command: -c "import time; time.sleep(1000000000)"
    entrypoint: npx
    env_file:
      - .env
    working_dir: /glimpse-ui
    volumes:
      - ./glimpse-ui:/glimpse-ui
      - ./.cache/whisper/:/root/.cache/whisper/
    ports:
      - "8081:8080"

    depends_on:
      api:
        condition: service_healthy

  listener:
    build: ./glimpse-listener
    command: /glimpse-listener/src/main.py
    #command: -c "import time; time.sleep(1000000000)"
    entrypoint: python
    env_file:
      - .env
    working_dir: /glimpse-listener
    volumes:
      - ./glimpse-listener:/glimpse-listener
      - ./.cache/whisper/:/root/.cache/whisper/
    depends_on:
      api:
        condition: service_healthy

  events:
    build: ./glimpse-events
    command: /glimpse-events/src/main.py
    #command: -c "import time; time.sleep(1000000000)"
    entrypoint: python
    env_file:
      - .env
    working_dir: /glimpse-events
    volumes:
      - ./glimpse-events:/glimpse-events
      - ./.cache/whisper/:/root/.cache/whisper/
    depends_on:
      api:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000" # MinIO web and API access
      - "9001:9001" # MinIO Console (UI)
    environment:
      MINIO_ROOT_USER: your-access-key # Replace with your desired access key
      MINIO_ROOT_PASSWORD: your-secret-key # Replace with your desired secret key
    volumes:
      - minio-data:/data # Persistent storage for bucket data
    command: server /data --console-address ":9001" # Start MinIO and enable console UI
    restart: always

volumes:
  minio-data:
    driver: local
